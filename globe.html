<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:white}canvas{display:block;width:100%;height:100%}#status{position:absolute;inset:0;display:grid;place-items:center;font:14px sans-serif;color:#647985}</style></head><body><div id="status">Loading globe…</div><script src="https://www.keenon.com/assets/site/keenon-static/static.keenon.com/assets/js/three.js"></script><script>
const statusEl=document.getElementById('status');
try {
 const scene=new THREE.Scene(), camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.1,1000);
 camera.position.set(0,100,-400);camera.lookAt(scene.position);
 scene.add(new THREE.AmbientLight(0xffffff,1));
 const renderer=new THREE.WebGLRenderer({antialias:true});
 renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));renderer.setClearColor(0xffffff,1);
 renderer.setSize(innerWidth,innerHeight);document.body.appendChild(renderer.domElement);
 const geometry=new THREE.SphereGeometry(150,48,48);
 const texture=new THREE.TextureLoader().load('https://storage.keenon.cn/assets/site/keenon-static/static.keenon.com/assets/images/earth4.jpg',()=>statusEl.remove(),undefined,()=>{statusEl.textContent='Unable to load globe';});
 const material=new THREE.MeshPhongMaterial({map:texture});
 const earth=new THREE.Mesh(geometry,material);scene.add(earth);
 let last=0;
 function animate(time){requestAnimationFrame(animate);const dt=Math.min((time-last)/1000,.05);last=time;if(!document.hidden){earth.rotation.y-=.24*dt;renderer.render(scene,camera);}}
 requestAnimationFrame(animate);
 addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
 let dragging=false,x=0;renderer.domElement.style.touchAction='pan-y';
 renderer.domElement.addEventListener('pointerdown',e=>{dragging=true;x=e.clientX;renderer.domElement.setPointerCapture(e.pointerId);});
 renderer.domElement.addEventListener('pointermove',e=>{if(dragging){earth.rotation.y+=(e.clientX-x)*.008;x=e.clientX;}});
 renderer.domElement.addEventListener('pointerup',()=>dragging=false);
 renderer.domElement.addEventListener('pointercancel',()=>dragging=false);
} catch(e){statusEl.textContent='Globe is unavailable in this browser';}
</script></body></html>
